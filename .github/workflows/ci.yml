name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            install: brew install tmux
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            install: sudo apt-get update && sudo apt-get install -y tmux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            install: sudo apt-get update && sudo apt-get install -y tmux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Install tmux
        run: ${{ matrix.install }}
      - name: Verify
        run: hk check --all
        env:
          AMUX_TEST_RUNTIME: native
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amux-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  prepare-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    outputs:
      released: ${{ steps.release-result.outputs.released }}
      version: ${{ steps.release-result.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Verify Cargo version editor
        run: cargo set-version --version
      - name: Check conventional commits
        run: cog check --from-latest-tag
      - name: Record pre-bump commit
        id: pre-release
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: release
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: bump
          args: --auto --skip-ci
      - name: Detect a new release
        id: release-result
        env:
          BEFORE_RELEASE: ${{ steps.pre-release.outputs.commit }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$BEFORE_RELEASE" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi
      - name: Push release commit and tag
        if: steps.release-result.outputs.released == 'true'
        run: git push origin HEAD:main --tags

  package-release:
    if: needs.prepare-release.outputs.released == 'true'
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            install: brew install tmux
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            install: sudo apt-get update && sudo apt-get install -y tmux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            install: sudo apt-get update && sudo apt-get install -y tmux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.version }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Install tmux
        run: ${{ matrix.install }}
      - name: Package and verify bundled launcher
        run: mise run package-check
        env:
          TARGET: ${{ matrix.target }}
      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-amux-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-release:
    if: needs.prepare-release.outputs.released == 'true'
    needs: [prepare-release, package-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-amux-*
          merge-multiple: true
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare-release.outputs.version }}
          generate_release_notes: true
          files: '*.tar.gz'
