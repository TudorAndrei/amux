# License policy for the dependencies compiled into amux release binaries.
# Keep transitive dependencies enabled. Build-only and development-only crates
# are not distributed in the release archives and are intentionally excluded.
accepted = [
    "Apache-2.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
